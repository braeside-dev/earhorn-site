title: EarHorn
description: "Turn two iPhones into a secure, private baby monitor. No cloud servers, no account, no subscription. P-256 encrypted audio streaming over your home WiFi."
url: https://earhorn.app
baseurl: ""

permalink: /blog/:title/

plugins:
  - jekyll-sitemap

exclude:
  - README.md

# Jekyll drops dot-directories from the built site by default. The Apple
# app-site-association file has to be served from /.well-known/ for pairing
# links to open the app, so the directory is included by name. A copy also
# sits at the site root, which is the other location iOS checks.
include:
  - .well-known
